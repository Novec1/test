<div>
  <script nonce="csp_nonce" src="https://unpkg.com@<3.0.0/dist-sdk/umd/index.js"></script>
  <script nonce="csp_nonce" type="text/javascript">
    if ('VKIDSDK' in window) {
      const VKID = window.VKIDSDK;

      VKID.Config.init({
        app: 54410380,
        redirectUrl: 'https://novec1.github.io', // Этот URL должен совпадать с тем, что в настройках VK ID
        responseMode: VKID.ConfigResponseMode.Redirect, // <-- ИЗМЕНЕНО
        source: VKID.ConfigSource.LOWCODE,
        scope: 'email', // Добавьте 'email' или 'phone', если нужно получить эти данные
      });

      const oneTap = new VKID.OneTap();

      oneTap.render({
        container: document.currentScript.parentElement,
        showAlternativeLogin: true
      })
      .on(VKID.WidgetEvents.ERROR, vkidOnError)
      .on(VKID.OneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
        // Здесь обработка не нужна, т.к. произойдет редирект
      });
    
      function vkidOnError(error) {
        console.error('VK ID Error:', error); // Выведет детали ошибки в консоль
        // Можно показать сообщение об ошибке на странице
      }
    }
  </script>
</div>
